<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" fill="none" class="hero-visual-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="720" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#070B19" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas Grid & Ambient Glows -->
  <rect x="10" y="10" width="700" height="520" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  
  <circle cx="200" cy="160" r="140" fill="#0284C7" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="540" cy="380" r="160" fill="#059669" opacity="0.1" filter="url(#softGlow)" />

  <!-- Perspective Floor Grid (Residential Foundation & Landscape) -->
  <g opacity="0.25" stroke="#38BDF8" stroke-width="1">
    <line x1="80" y1="460" x2="640" y2="460" />
    <line x1="120" y1="420" x2="600" y2="420" />
    <line x1="160" y1="380" x2="560" y2="380" />
    <line x1="360" y1="340" x2="60" y2="480" />
    <line x1="360" y1="340" x2="200" y2="480" />
    <line x1="360" y1="340" x2="360" y2="480" />
    <line x1="360" y1="340" x2="520" y2="480" />
    <line x1="360" y1="340" x2="660" y2="480" />
  </g>

  <!-- Modern Residential Architecture Silhouettes (Single-Family & Multi-Family Residential Focus) -->
  <g opacity="0.9">
    <!-- Residential Home 1 (Left Townhome/Single-Family Structure) -->
    <polygon points="120,240 180,180 240,240 240,410 120,410" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <polygon points="120,240 180,180 240,240" fill="url(#roofGrad)" stroke="#475569" stroke-width="1.5" />
    <!-- Residential Windows & Warm Home Glow -->
    <rect x="140" y="260" width="30" height="40" rx="3" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1" />
    <rect x="190" y="260" width="30" height="40" rx="3" fill="#FDE047" fill-opacity="0.35" stroke="#FDE047" stroke-width="1" />
    <rect x="140" y="325" width="30" height="45" rx="3" fill="#38BDF8" fill-opacity="0.25" stroke="#334155" stroke-width="1" />
    <!-- Front Entrance Door -->
    <rect x="190" y="335" width="28" height="75" rx="2" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
    <circle cx="212" cy="375" r="2" fill="#34D399" />

    <!-- Modern Contemporary Residence 2 (Center-Right Architectural Pavilion) -->
    <!-- Pitched Contemporary Roofline -->
    <polygon points="260,170 380,120 490,170 490,410 260,410" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <polygon points="250,170 380,115 500,170" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    
    <!-- Second Story Balcony & Glass Windows -->
    <rect x="290" y="195" width="75" height="65" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <rect x="385" y="195" width="75" height="65" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
    <line x1="285" y1="265" x2="475" y2="265" stroke="#64748B" stroke-width="2" />
    
    <!-- First Story Living Room & Patio -->
    <rect x="290" y="295" width="95" height="85" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <rect x="405" y="315" width="60" height="95" rx="2" fill="#0F172A" stroke="#34D399" stroke-width="1.5" />
    
    <!-- Architectural Pergola / Porch Element -->
    <line x1="270" y1="280" x2="500" y2="280" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    <line x1="270" y1="280" x2="270" y2="410" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
    <line x1="495" y1="280" x2="495" y2="410" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />

    <!-- Greenery & Residential Foliage Accents -->
    <circle cx="245" cy="385" r="14" fill="#059669" fill-opacity="0.4" stroke="#34D399" stroke-width="1.5" />
    <circle cx="510" cy="380" r="16" fill="#059669" fill-opacity="0.4" stroke="#34D399" stroke-width="1.5" />
  </g>

  <!-- Digital Intelligence & AI Network Matrix (Professional Services Pillar) -->
  <g opacity="0.85">
    <path d="M 170 120 Q 280 60 420 110 T 580 180" fill="none" stroke="url(#neonBlue)" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 280 260 Q 420 210 560 270" fill="none" stroke="url(#neonEmerald)" stroke-width="2" />
    
    <!-- Intelligent Nodes -->
    <circle cx="420" cy="110" r="5" fill="#38BDF8" filter="url(#softGlow)" />
    <circle cx="580" cy="180" r="6" fill="#34D399" filter="url(#softGlow)" />
    <circle cx="280" cy="260" r="5" fill="#FDE047" filter="url(#softGlow)" />
    <circle cx="560" cy="270" r="6" fill="#38BDF8" filter="url(#softGlow)" />
  </g>

  <!-- Floating Glassmorphic HUD Badge 1: Fractional Leadership & AI -->
  <g filter="url(#cardShadow)">
    <rect x="420" y="75" width="250" height="96" rx="14" fill="url(#cardGlass)" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="454" cy="123" r="20" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5" />
    <path d="M447 123H461M454 116V130" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <text x="484" y="113" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Fractional CTO &amp; AI</text>
    <text x="484" y="131" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11">Scalable Executive Tech</text>
    <rect x="484" y="141" width="70" height="16" rx="8" fill="#0369A1" fill-opacity="0.4" />
    <text x="519" y="153" text-anchor="middle" fill="#38BDF8" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600">Enterprise Ready</text>
  </g>

  <!-- Floating Glassmorphic HUD Badge 2: Residential Property Management -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="325" width="255" height="92" rx="14" fill="url(#cardGlass)" stroke="#34D399" stroke-width="1.2" />
    <circle cx="84" cy="371" r="20" fill="#059669" fill-opacity="0.25" stroke="#34D399" stroke-width="1.5" />
    <path d="M78 371L82 375L90 367" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="114" y="361" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700">Residential Property</text>
    <text x="114" y="379" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11">Single &amp; Multi-Family Homes</text>
    <text x="114" y="399" fill="#34D399" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">Dedicated Care &amp; Upkeep</text>
  </g>

  <!-- Floating Glassmorphic HUD Badge 3: Efficiency & Retention Stat -->
  <g filter="url(#cardShadow)">
    <rect x="470" y="325" width="200" height="85" rx="14" fill="url(#cardGlass)" stroke="#D97706" stroke-width="1.2" />
    <text x="492" y="355" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="11">Executive Leverage</text>
    <text x="492" y="385" fill="#FDE047" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800">10x Output</text>
    <text x="492" y="401" fill="#CBD5E1" font-family="'Inter', system-ui, sans-serif" font-size="10">Fractional EA &amp; Process SOPs</text>
  </g>
</svg>
